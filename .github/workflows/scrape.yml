name: Daily scrape
on:
  schedule:
    - cron: "0 12 * * *"  # 12:00 UTC = ~6am MDT
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/scrape_signals.py
      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/signals.json
          git diff --staged --quiet || git commit -m "chore: daily signal scrape"
          git push
