<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utah Land & Property — Market Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a1f26;
      --surface-2: #242b33;
      --border: #2f3842;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #4a9eff;
      --below: #34d399;
      --above: #fbbf24;
      --flag: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .header {
      height: 60px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 1.25rem;
    }
    .brand {
      font-family: 'Source Serif 4', serif;
      font-weight: 700;
      font-size: 1.2rem;
      color: #fff;
    }
    .brand span { color: var(--accent); }
    .hero {
      position: relative;
      height: 340px;
      background: linear-gradient(rgba(10,15,25,0.55), rgba(10,15,25,0.55)),
                  url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=80') center/cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }
    .hero h1 {
      font-family: 'Source Serif 4', serif;
      font-size: 2.6rem;
      font-weight: 700;
      margin: 0 0 0.75rem;
      letter-spacing: -0.02em;
      max-width: 720px;
    }
    .hero p {
      margin: 0 0 1.5rem;
      color: #e5e7eb;
      font-size: 1.05rem;
      max-width: 540px;
    }
    .hero-search {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.85rem 1.1rem;
      font-size: 1rem;
      color: #111;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    }
    .filters {
      display: flex;
      gap: 0.4rem;
      margin-top: 1rem;
    }
    .filter-btn {
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.25);
      color: #fff;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.8rem;
    }
    .filter-btn.active { background: var(--accent); border-color: var(--accent); }
    .disclaimer {
      background: #1e293b;
      padding: 0.45rem 1.5rem;
      font-size: 0.75rem;
      color: #94a3b8;
      text-align: center;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 420px;
      height: calc(100vh - 60px - 340px - 36px);
      min-height: 480px;
    }
    #map { height: 100%; }
    .panel {
      overflow-y: auto;
      background: var(--surface);
      border-left: 1px solid var(--border);
      padding: 1rem;
    }
    .count { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.75rem; }
    .item {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.9rem 1rem;
      margin-bottom: 0.65rem;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .item:hover { border-color: var(--accent); }
    .signal {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }
    .BUY { background: rgba(52,211,153,0.15); color: var(--below); }
    .FADE { background: rgba(251,191,36,0.15); color: var(--above); }
    .DISTRESSED { background: rgba(248,113,113,0.15); color: var(--flag); }
    .price { font-size: 1.25rem; font-weight: 700; margin: 0.15rem 0; }
    .delta { font-size: 0.8rem; color: var(--muted); }
    .addr { font-weight: 600; }
    .city { font-size: 0.85rem; color: var(--muted); }
    .note { font-size: 0.8rem; color: #cbd5e1; margin-top: 0.35rem; line-height: 1.4; }
    .meta { font-size: 0.75rem; color: #6b7280; margin-top: 0.4rem; }
    @media (max-width: 900px) {
      .hero { height: 280px; }
      .hero h1 { font-size: 1.9rem; }
      .layout { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; height: auto; }
      .panel { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Utah Land <span>& Property</span></div>
  </div>

  <section class="hero">
    <h1>Utah Market Analysis</h1>
    <p>Independent pricing context and neighborhood signals. Analysis only — not a brokerage.</p>
    <input class="hero-search" id="search" placeholder="Search address or city…" oninput="render()">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All Signals</button>
      <button class="filter-btn" data-filter="BUY">Below ELO</button>
      <button class="filter-btn" data-filter="FADE">Above ELO</button>
      <button class="filter-btn" data-filter="DISTRESSED">Flags</button>
    </div>
  </section>

  <div class="disclaimer">
    We do not list, sell, or broker real estate. No agency relationship is created. All observations are informational and should be independently verified.
  </div>

  <div class="layout">
    <div id="map"></div>
    <div class="panel">
      <div class="count" id="count">5 signals</div>
      <div id="items"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const sample = [
      { call: "BUY", price: "$389,000", delta: "−12% vs ELO", address: "4200 S Highland Dr", city: "Salt Lake City", why: "Priced below neighborhood ELO baseline. Observation only.", agent: "Smith", elo: 1458, lat: 40.685, lon: -111.84 },
      { call: "FADE", price: "$749,000", delta: "+18% vs ELO", address: "1800 E 900 S", city: "Salt Lake City", why: "Above ELO in a softening context.", agent: "Jones", elo: 1512, lat: 40.748, lon: -111.845 },
      { call: "DISTRESSED", price: "$412,000", delta: "Short sale flag", address: "77 N 500 E", city: "Salt Lake City", why: "Distressed indicator. Verify independently.", agent: "Park", elo: 1480, lat: 40.77, lon: -111.885 },
      { call: "BUY", price: "$275,000", delta: "−9% vs ELO", address: "1450 W 3300 S", city: "Provo", why: "Below neighborhood ELO with stable macro.", agent: "Lee", elo: 1522, lat: 40.22, lon: -111.68 },
      { call: "FADE", price: "$620,000", delta: "+14% vs ELO", address: "890 E 2100 N", city: "Ogden", why: "Pricing above recent neighborhood range.", agent: "Taylor", elo: 1445, lat: 41.24, lon: -111.95 }
    ];

    let filter = "all";
    let map, markers = [];

    map = L.map("map").setView([40.76, -111.89], 10);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filter = btn.dataset.filter;
        render();
      };
    });

    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    function render() {
      const q = (document.getElementById("search").value || "").toLowerCase();
      let rows = sample;
      if (filter !== "all") rows = rows.filter(r => r.call === filter);
      if (q) rows = rows.filter(r => (r.address + r.city).toLowerCase().includes(q));

      document.getElementById("count").textContent = rows.length + " signal" + (rows.length === 1 ? "" : "s");

      document.getElementById("items").innerHTML = rows.map((r, i) => `
        <div class="item" onclick="focusMarker(${i})">
          <span class="signal ${r.call}">${r.call === "BUY" ? "Below ELO" : r.call === "FADE" ? "Above ELO" : "Flag"}</span>
          <div class="price">${r.price} <span class="delta">${r.delta}</span></div>
          <div class="addr">${r.address}</div>
          <div class="city">${r.city}, UT</div>
          <div class="note">${r.why}</div>
          <div class="meta">Agent context: ${r.agent} (ELO ${r.elo})</div>
        </div>
      `).join("") || '<div style="color:#6b7280;padding:0.5rem">No matches.</div>';

      clearMarkers();
      rows.forEach((r, i) => {
        const color = r.call === "BUY" ? "#34d399" : r.call === "FADE" ? "#fbbf24" : "#f87171";
        const m = L.circleMarker([r.lat, r.lon], {
          radius: 8,
          color: "#fff",
          weight: 1.5,
          fillColor: color,
          fillOpacity: 0.9
        }).addTo(map).bindPopup(`<b>${r.price}</b><br>${r.address}<br><small>${r.delta}</small>`);
        m.on("click", () => {
          document.querySelectorAll(".item")[i]?.scrollIntoView({ behavior: "smooth", block: "nearest" });
        });
        markers.push(m);
      });

      if (rows.length) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.25));
      }
    }

    window.focusMarker = function(i) {
      if (markers[i]) {
        map.setView(markers[i].getLatLng(), 13);
        markers[i].openPopup();
      }
    };

    render();
  </script>
</body>
</html>
