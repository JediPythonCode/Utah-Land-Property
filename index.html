<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utah Land & Property — Live Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #006aff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #fff; color: var(--text); }
    .header {
      height: 68px; background: #fff; border-bottom: 1px solid #f0f0f0;
      display: flex; align-items: center; padding: 0 1.75rem; gap: 2rem;
    }
    .brand { font-weight: 800; font-size: 1.35rem; color: var(--accent); letter-spacing: -0.02em; }
    .status { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); }
    .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .status .dot.off { background: #ef4444; }
    .nav { display: flex; gap: 1.5rem; font-size: 0.95rem; font-weight: 500; color: #374151; }
    .nav span { cursor: pointer; }
    .nav span.active { color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
    .hero {
      height: 320px;
      background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                  url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1600&q=80') center/cover;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; color: #fff; padding: 2rem;
    }
    .hero h1 { font-size: 2.8rem; font-weight: 800; margin: 0 0 0.5rem; letter-spacing: -0.03em; text-shadow: 0 2px 12px rgba(0,0,0,0.3); }
    .hero p { margin: 0 0 1.25rem; font-size: 1rem; opacity: 0.9; max-width: 520px; }
    .macro-row { display: flex; gap: 1.5rem; font-size: 0.8rem; margin-bottom: 1rem; opacity: 0.95; }
    .macro-row span { background: rgba(255,255,255,0.15); padding: 4px 10px; border-radius: 6px; }
    .macro-row .alert { background: rgba(220,38,38,0.4); font-weight: 600; }
    .search-wrap {
      background: #fff; border-radius: 12px; padding: 0.35rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18); display: flex; width: 100%; max-width: 540px;
    }
    .search { flex: 1; border: none; padding: 0.8rem 1rem; font-size: 1rem; outline: none; border-radius: 10px; }
    .filters { display: flex; gap: 0.4rem; margin-top: 1rem; flex-wrap: wrap; justify-content: center; }
    .filter-btn {
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.35);
      color: #fff; padding: 0.35rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
    }
    .filter-btn.active { background: #fff; color: #111; }
    .disclaimer { background: #fffbeb; padding: 0.4rem 1.5rem; font-size: 0.72rem; color: #92400e; text-align: center; }
    .layout { display: grid; grid-template-columns: 1fr 480px; height: calc(100vh - 68px - 320px - 28px); min-height: 400px; }
    #map { height: 100%; }
    .list { overflow-y: auto; padding: 1rem; background: #fafafa; border-left: 1px solid #eee; }
    .count { font-size: 0.85rem; color: var(--muted); margin: 0 0 0.75rem 0.2rem; }
    .card {
      background: #fff; border: 1px solid #eee; border-radius: 12px;
      overflow: hidden; margin-bottom: 0.85rem; cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .card img { width: 100%; height: 170px; object-fit: cover; display: block; }
    .card-body { padding: 0.85rem 1rem 1rem; }
    .price { font-size: 1.3rem; font-weight: 800; margin: 0.15rem 0 0.1rem; }
    .details { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.25rem; }
    .addr { font-weight: 600; font-size: 0.95rem; }
    .city { font-size: 0.8rem; color: #6b7280; }
    .why { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; line-height: 1.4; }
    .badge {
      display: inline-block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em;
      padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
    }
    .BUY { background: #ccfbf1; color: #0f766e; }
    .FADE { background: #fef3c7; color: #b45309; }
    .DISTRESSED { background: #fee2e2; color: #b91c1c; }
    .HOLD { background: #e5e7eb; color: #374151; }
    .STANDARD { background: #f3f4f6; color: #6b7280; }
    .source-tag { font-size: 0.62rem; background: #f3f4f6; padding: 1px 5px; border-radius: 3px; color: #6b7280; margin-left: 6px; }
    .anomaly { font-size: 0.72rem; margin-top: 0.3rem; color: #92400e; }
    .agent-line { font-size: 0.72rem; color: #9ca3af; margin-top: 0.3rem; }
    .loading { display: flex; align-items: center; justify-content: center; height: 150px; color: var(--muted); font-size: 0.9rem; }
    .loading::after { content: ""; width: 14px; height: 14px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; margin-left: 8px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box { background: #fef2f2; border: 1px solid #fecaca; border-radius: 8px; padding: 1rem; margin: 0.5rem 0; font-size: 0.82rem; color: #991b1b; }
    .error-box code { background: #fee2e2; padding: 1px 4px; border-radius: 3px; font-size: 0.78rem; }
    @media (max-width: 900px) {
      .hero { height: 260px; }
      .hero h1 { font-size: 2rem; }
      .layout { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; height: auto; }
      .list { border-left: none; border-top: 1px solid #eee; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Utah Land Desk</div>
    <div class="status"><span class="dot" id="dot"></span><span id="status-text">Connecting…</span></div>
    <div class="nav">
      <span class="active">For Sale</span>
      <span>Analysis</span>
    </div>
  </div>

  <section class="hero">
    <h1>Homes. Land. Signals.</h1>
    <p>Live market analysis across Utah. Autonomous desk — updates every 15 min.</p>
    <div class="macro-row" id="macro-row"><span>Loading…</span></div>
    <div class="search-wrap">
      <input class="search" id="search" placeholder="City, address, or neighborhood…" oninput="render()">
    </div>
    <div class="filters" id="filters"></div>
  </section>

  <div class="disclaimer">
    Analysis only — not a brokerage. Signals from public records and market context. Verify independently.
  </div>

  <div class="layout">
    <div id="map"></div>
    <div class="list">
      <div class="count" id="count">Loading…</div>
      <div id="cards"><div class="loading">Fetching live data</div></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let allRows = [];
    let macro = {};
    let filter = "all";
    let map, markers = [];
    let lastUpdated = "";

    // ─── Map ──────────────────────────────────────────────────────────────────
    map = L.map("map").setView([39.32, -111.09], 7);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // ─── Fetch (the only thing that replaced hardcoded data) ─────────────────
    async function fetchDesk() {
      try {
        const resp = await fetch("/api/desk", { signal: AbortSignal.timeout(20000) });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        allRows = data.rows || [];
        macro = data.macro || {};
        lastUpdated = data.updated || "";
        setStatus(true);
        renderMacro();
        renderFilters();
        render();
      } catch (e) {
        setStatus(false);
        document.getElementById("cards").innerHTML = `
          <div class="error-box">
            <strong>Backend unreachable.</strong><br>${e.message}<br><br>
            Start the engine: <code>python scripts/run_desk.py</code><br>
            Retrying in 30s…
          </div>`;
        document.getElementById("count").textContent = "Offline";
      }
    }

    function setStatus(ok) {
      const dot = document.getElementById("dot");
      const text = document.getElementById("status-text");
      if (ok) {
        dot.classList.remove("off");
        const t = lastUpdated ? new Date(lastUpdated).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : "";
        text.textContent = `Live · ${allRows.length} listings${t ? ` · ${t}` : ""}`;
      } else {
        dot.classList.add("off");
        text.textContent = "Offline — retrying";
      }
    }

    // ─── Macro (populated from backend, not hardcoded) ────────────────────────
    function renderMacro() {
      const el = document.getElementById("macro-row");
      const parts = [];
      if (macro.rate_30yr) parts.push(`<span>Rate ${macro.rate_30yr.toFixed(2)}%${macro.rates_rising ? " ↑" : ""}</span>`);
      if (macro.unemployment_ut) parts.push(`<span>UE ${macro.unemployment_ut.toFixed(1)}%${macro.ue_rising ? " ↑" : ""}</span>`);
      if (macro.months_of_supply) parts.push(`<span>MoS ${macro.months_of_supply.toFixed(1)}</span>`);
      if (macro.inventory_change_pct) parts.push(`<span>Inv ${macro.inventory_change_pct > 0 ? "+" : ""}${macro.inventory_change_pct.toFixed(0)}%</span>`);
      if (macro.news_flags?.length) parts.push(`<span class="alert">📰 ${macro.news_flags[0].slice(0, 40)}</span>`);
      el.innerHTML = parts.length ? parts.join("") : "<span>No macro yet</span>";
    }

    // ─── Dynamic Filters (generated from actual data, not hardcoded) ─────────
    function renderFilters() {
      // Collect all unique call values from live data
      const calls = [...new Set(allRows.map(r => r.grade?.call).filter(Boolean))];
      const sources = [...new Set(allRows.map(r => r.source).filter(Boolean))];

      // Build filter list: "all" + each call type found in data
      const labels = { BUY: "Below ELO", FADE: "Above ELO", DISTRESSED: "Distressed", HOLD: "Hold", STANDARD: "Fair" };
      const btns = [["all", `All (${allRows.length})`]];
      for (const c of calls.sort()) {
        const count = allRows.filter(r => r.grade?.call === c).length;
        btns.push([c, `${labels[c] || c} (${count})`]);
      }

      document.getElementById("filters").innerHTML = btns.map(([id, label]) =>
        `<button class="filter-btn ${id === filter ? "active" : ""}" data-filter="${id}">${label}</button>`
      ).join("");
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.onclick = () => {
          filter = btn.dataset.filter;
          renderFilters();
          render();
        };
      });
    }

    // ─── Render ───────────────────────────────────────────────────────────────
    function getFiltered() {
      const q = (document.getElementById("search").value || "").toLowerCase();
      let rows = allRows;
      if (filter !== "all") rows = rows.filter(r => r.grade?.call === filter);
      if (q) rows = rows.filter(r => (r.address || "").toLowerCase().includes(q));
      return rows;
    }

    function render() {
      const rows = getFiltered();
      document.getElementById("count").textContent =
        `${rows.length} listing${rows.length === 1 ? "" : "s"}${lastUpdated ? ` · ${new Date(lastUpdated).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}` : ""}`;

      const el = document.getElementById("cards");
      if (!allRows.length) { el.innerHTML = '<div class="loading">Waiting for first pull</div>'; return; }
      if (!rows.length) { el.innerHTML = '<div style="padding:1rem;color:#6b7280">No matches.</div>'; }
      else {
        el.innerHTML = rows.map((r, i) => {
          const call = r.grade?.call || "STANDARD";
          const price = r.price ? "$" + Number(r.price).toLocaleString() : "—";
          const anomalies = (r.grade?.anomalies || []).map(a => `⚡ ${a}`).join("<br>");
          const agent = r.agent?.name ? `${r.agent.name}${r.agent.elo ? ` (ELO ${Math.round(r.agent.elo)})` : ""}` : "";
          const src = r.source ? `<span class="source-tag">${r.source}</span>` : "";
          const beds = r.beds ? `${r.beds} bd · ${r.baths || "?"} ba` : "";
          const sqft = r.sqft ? ` · ${Number(r.sqft).toLocaleString()} sqft` : "";
          return `
            <div class="card" data-idx="${i}" onclick="focusMarker(${i})">
              ${r.img ? `<img src="${r.img}" alt="" loading="lazy">` : ""}
              <div class="card-body">
                <span class="badge ${call}">${call}</span>${src}
                <div class="price">${price} <span style="font-size:0.75rem;font-weight:500;color:#6b7280">${r.grade?.line || ""}</span></div>
                ${beds || sqft ? `<div class="details">${beds}${sqft}</div>` : ""}
                <div class="addr">${r.address || "Unknown"}</div>
                ${r.grade?.why ? `<div class="why">${r.grade.why}</div>` : ""}
                ${anomalies ? `<div class="anomaly">${anomalies}</div>` : ""}
                ${agent ? `<div class="agent-line">Agent: ${agent}</div>` : ""}
              </div>
            </div>`;
        }).join("");
      }

      // Map
      clearMarkers();
      rows.forEach((r, i) => {
        if (!r.lat || !r.lon) return;
        const call = r.grade?.call || "STANDARD";
        const color = { BUY: "#0d9488", FADE: "#d97706", DISTRESSED: "#dc2626", HOLD: "#6b7280", STANDARD: "#9ca3af" }[call] || "#9ca3af";
        const m = L.circleMarker([r.lat, r.lon], { radius: 9, color: "#fff", weight: 2, fillColor: color, fillOpacity: 0.9 })
          .addTo(map)
          .bindPopup(`<b>${r.price ? "$" + Number(r.price).toLocaleString() : ""}</b><br>${r.address}<br><small>${r.grade?.line || ""}</small>`);
        m.on("click", () => document.querySelector(`.card[data-idx="${i}"]`)?.scrollIntoView({ behavior: "smooth", block: "nearest" }));
        markers.push(m);
      });
      if (markers.length) map.fitBounds(L.featureGroup(markers).getBounds().pad(0.25));
    }

    function clearMarkers() { markers.forEach(m => map.removeLayer(m)); markers = []; }
    window.focusMarker = function(i) { if (markers[i]) { map.setView(markers[i].getLatLng(), 13); markers[i].openPopup(); } };

    // ─── Auto-refresh ─────────────────────────────────────────────────────────
    fetchDesk();
    setInterval(fetchDesk, 60_000); // Poll every 60s (backend updates every 15min)
  </script>
</body>
</html>
