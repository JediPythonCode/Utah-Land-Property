<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utah Land & Property — Live Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #f7f8fa;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #006aff;
      --buy: #0d9488;
      --fade: #d97706;
      --distressed: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      overflow: hidden;
    }
    .topbar {
      height: 64px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 1.5rem;
      gap: 1.5rem;
    }
    .brand { font-weight: 800; font-size: 1.25rem; color: var(--accent); letter-spacing: -0.02em; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e; display: inline-block; margin-right: 6px;
    }
    .status-dot.offline { background: #ef4444; }
    .status-text { font-size: 0.75rem; color: var(--muted); }
    .search {
      flex: 1;
      max-width: 480px;
      background: #f3f4f6;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 0.95rem;
    }
    .filters { display: flex; gap: 0.5rem; }
    .filter-btn {
      background: #fff;
      border: 1px solid var(--border);
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .macro-strip {
      background: #fff;
      border-bottom: 1px solid var(--border);
      padding: 0.5rem 1.5rem;
      display: flex;
      gap: 2rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
    .macro-strip strong { color: var(--text); font-weight: 600; }
    .macro-strip .flag { color: var(--distressed); font-weight: 600; }
    .disclaimer-bar {
      background: #fffbeb;
      border-bottom: 1px solid #fde68a;
      padding: 0.45rem 1.5rem;
      font-size: 0.78rem;
      color: #92400e;
    }
    .layout {
      display: grid;
      grid-template-columns: 1fr 480px;
      height: calc(100vh - 64px - 36px - 38px);
    }
    #map { height: 100%; }
    .list {
      overflow-y: auto;
      padding: 1rem;
      background: #f9fafb;
      border-left: 1px solid var(--border);
    }
    .results-count { font-size: 0.85rem; color: var(--muted); margin: 0 0 0.75rem 0.25rem; }
    .card {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: box-shadow 0.15s;
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .card img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .card-body { padding: 0.9rem 1rem 1rem; }
    .price { font-size: 1.35rem; font-weight: 800; margin: 0 0 0.2rem; }
    .details { font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    .addr { font-weight: 600; font-size: 0.95rem; }
    .why { font-size: 0.8rem; color: var(--muted); margin-top: 0.4rem; line-height: 1.4; }
    .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      margin-bottom: 0.3rem;
    }
    .BUY { background: #ccfbf1; color: #0f766e; }
    .FADE { background: #fef3c7; color: #b45309; }
    .DISTRESSED { background: #fee2e2; color: #b91c1c; }
    .HOLD { background: #e5e7eb; color: #374151; }
    .STANDARD { background: #f3f4f6; color: #6b7280; }
    .agent { font-size: 0.75rem; color: #9ca3af; margin-top: 0.35rem; }
    .source-tag {
      font-size: 0.65rem;
      background: #f3f4f6;
      padding: 1px 5px;
      border-radius: 3px;
      color: #6b7280;
      margin-left: 6px;
    }
    .anomaly-icons { font-size: 0.8rem; margin-top: 0.3rem; }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .loading::after {
      content: "";
      width: 16px; height: 16px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin-left: 10px;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-box {
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 1rem;
      margin: 1rem 0;
      font-size: 0.85rem;
      color: #991b1b;
    }
    .error-box code { background: #fee2e2; padding: 1px 4px; border-radius: 3px; font-size: 0.8rem; }
    @media (max-width: 900px) {
      .layout { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; }
      .list { border-left: none; border-top: 1px solid var(--border); }
      .macro-strip { flex-wrap: wrap; gap: 1rem; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="brand">Utah Land Desk</div>
    <div>
      <span class="status-dot" id="status-dot"></span>
      <span class="status-text" id="status-text">Connecting…</span>
    </div>
    <input class="search" id="search" placeholder="Search city, address…" oninput="render()">
    <div class="filters">
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="BUY">Below ELO</button>
      <button class="filter-btn" data-filter="FADE">Above ELO</button>
      <button class="filter-btn" data-filter="DISTRESSED">Flags</button>
    </div>
  </div>

  <div class="macro-strip" id="macro-strip">
    <span>Loading macro…</span>
  </div>

  <div class="disclaimer-bar">
    <strong>Analysis only — not a brokerage.</strong> Independent market observations for Utah property. All data is informational and should be independently verified.
  </div>

  <div class="layout">
    <div id="map"></div>
    <div class="list">
      <div class="results-count" id="count">Loading…</div>
      <div id="cards"><div class="loading">Fetching live listings</div></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // ─── State ────────────────────────────────────────────────────────────────
    let allRows = [];
    let macroData = {};
    let filter = "all";
    let map, markers = [];
    let lastUpdated = "";
    let refreshTimer = null;

    // ─── Map ──────────────────────────────────────────────────────────────────
    map = L.map("map").setView([39.9, -111.85], 7);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // ─── Filters ──────────────────────────────────────────────────────────────
    document.querySelectorAll(".filter-btn").forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        filter = btn.dataset.filter;
        render();
      };
    });

    // ─── Fetch ────────────────────────────────────────────────────────────────
    async function fetchDesk() {
      try {
        const resp = await fetch("/api/desk", { signal: AbortSignal.timeout(15000) });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const data = await resp.json();
        allRows = data.rows || [];
        macroData = data.macro || {};
        lastUpdated = data.updated || "";
        setStatus(true, allRows.length);
        renderMacro();
        render();
      } catch (e) {
        setStatus(false, 0);
        document.getElementById("cards").innerHTML = `
          <div class="error-box">
            <strong>Backend not reachable.</strong><br>
            ${e.message}<br><br>
            Make sure the autonomous engine is running:<br>
            <code>python scripts/run_desk.py</code><br><br>
            The page will retry automatically in 30s.
          </div>`;
        document.getElementById("count").textContent = "Offline";
      }
    }

    function setStatus(ok, count) {
      const dot = document.getElementById("status-dot");
      const text = document.getElementById("status-text");
      if (ok) {
        dot.classList.remove("offline");
        const t = lastUpdated ? new Date(lastUpdated).toLocaleTimeString() : "just now";
        text.textContent = `Live · ${count} listings · ${t}`;
      } else {
        dot.classList.add("offline");
        text.textContent = "Offline";
      }
    }

    // ─── Macro Strip ──────────────────────────────────────────────────────────
    function renderMacro() {
      const el = document.getElementById("macro-strip");
      const parts = [];
      if (macroData.rate_30yr) {
        const arrow = macroData.rates_rising ? "↑" : "↓";
        const cls = macroData.rates_rising ? "flag" : "";
        parts.push(`<span>30yr Rate: <strong class="${cls}">${macroData.rate_30yr.toFixed(2)}% ${arrow}</strong></span>`);
      }
      if (macroData.unemployment_ut) {
        const cls = macroData.ue_rising ? "flag" : "";
        parts.push(`<span>UE (UT): <strong class="${cls}">${macroData.unemployment_ut.toFixed(1)}%</strong></span>`);
      }
      if (macroData.months_of_supply) {
        parts.push(`<span>MoS: <strong>${macroData.months_of_supply.toFixed(1)}</strong></span>`);
      }
      if (macroData.inventory_change_pct) {
        const cls = macroData.inventory_rising ? "flag" : "";
        parts.push(`<span>Inventory Δ30d: <strong class="${cls}">${macroData.inventory_change_pct > 0 ? "+" : ""}${macroData.inventory_change_pct.toFixed(0)}%</strong></span>`);
      }
      if (macroData.news_flags && macroData.news_flags.length) {
        parts.push(`<span class="flag">📰 ${macroData.news_flags[0].slice(0, 60)}…</span>`);
      }
      el.innerHTML = parts.length ? parts.join("") : "<span>No macro data yet</span>";
    }

    // ─── Render ───────────────────────────────────────────────────────────────
    function getFiltered() {
      const q = (document.getElementById("search").value || "").toLowerCase();
      let rows = allRows;
      if (filter !== "all") rows = rows.filter(r => r.grade?.call === filter);
      if (q) rows = rows.filter(r => (r.address || "").toLowerCase().includes(q));
      return rows;
    }

    function render() {
      const rows = getFiltered();
      document.getElementById("count").textContent =
        `${rows.length} listing${rows.length === 1 ? "" : "s"}${lastUpdated ? ` · Updated ${new Date(lastUpdated).toLocaleTimeString()}` : ""}`;

      const container = document.getElementById("cards");
      if (!allRows.length) {
        container.innerHTML = '<div class="loading">Waiting for data</div>';
        return;
      }
      if (!rows.length) {
        container.innerHTML = '<div style="padding:1rem;color:#6b7280">No matches.</div>';
      } else {
        container.innerHTML = rows.map((r, i) => {
          const call = r.grade?.call || "STANDARD";
          const label = { BUY: "Below ELO", FADE: "Above ELO", DISTRESSED: "Flag", HOLD: "Hold", STANDARD: "Fair" }[call] || call;
          const anomalies = (r.grade?.anomalies || []).map(a => `⚡${a}`).join(" ");
          const agent = r.agent ? `Agent: ${r.agent.name}${r.agent.elo ? ` (ELO ${Math.round(r.agent.elo)})` : ""}` : "";
          const source = r.source ? `<span class="source-tag">${r.source}</span>` : "";
          return `
            <div class="card" data-idx="${i}" onclick="focusMarker(${i})">
              ${r.img ? `<img src="${r.img}" alt="" loading="lazy">` : ""}
              <div class="card-body">
                <span class="badge ${call}">${label}</span>
                <div class="price">${formatPrice(r.price)} <span style="font-size:0.8rem;font-weight:500;color:#6b7280">${r.grade?.line || ""}</span></div>
                ${r.beds ? `<div class="details">${r.beds} bd · ${r.baths || "?"} ba · ${r.sqft ? r.sqft.toLocaleString() + " sqft" : ""}</div>` : ""}
                <div class="addr">${r.address || "Unknown address"}</div>
                ${r.city ? `<div style="font-size:0.85rem;color:#6b7280">${r.city}</div>` : ""}
                ${r.grade?.why ? `<div class="why">${r.grade.why}</div>` : ""}
                ${anomalies ? `<div class="anomaly-icons">${anomalies}</div>` : ""}
                ${agent ? `<div class="agent">${agent}</div>` : ""}
                ${source}
              </div>
            </div>`;
        }).join("");
      }

      // Map markers
      clearMarkers();
      rows.forEach((r, i) => {
        const lat = r.lat, lon = r.lon;
        if (!lat || !lon) return;
        const call = r.grade?.call || "STANDARD";
        const color = { BUY: "#0d9488", FADE: "#d97706", DISTRESSED: "#dc2626", HOLD: "#6b7280", STANDARD: "#9ca3af" }[call] || "#9ca3af";
        const m = L.circleMarker([lat, lon], {
          radius: 9, color: "#fff", weight: 2, fillColor: color, fillOpacity: 0.95
        }).addTo(map).bindPopup(`<b>${formatPrice(r.price)}</b><br>${r.address}<br><small>${r.grade?.line || ""}</small>`);
        m.on("click", () => {
          document.querySelector(`.card[data-idx="${i}"]`)?.scrollIntoView({ behavior: "smooth", block: "nearest" });
        });
        markers.push(m);
      });
      if (markers.length) {
        map.fitBounds(L.featureGroup(markers).getBounds().pad(0.2));
      }
    }

    function formatPrice(p) {
      if (!p) return "—";
      return "$" + Number(p).toLocaleString();
    }

    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    window.focusMarker = function(i) {
      const rows = getFiltered();
      if (markers[i]) {
        map.setView(markers[i].getLatLng(), 14);
        markers[i].openPopup();
      }
    };

    // ─── Auto-refresh every 60s ───────────────────────────────────────────────
    function startPolling() {
      refreshTimer = setInterval(fetchDesk, 60_000);
    }

    // ─── Init ─────────────────────────────────────────────────────────────────
    fetchDesk();
    startPolling();
  </script>
</body>
</html>
