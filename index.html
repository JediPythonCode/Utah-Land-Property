<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utah Land & Property — Market Analysis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --border: #e5e7eb;
      --text: #111827;
      --muted: #6b7280;
      --accent: #006aff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; background: #fff; color: var(--text); }
    .header {
      height: 68px; background: #fff; border-bottom: 1px solid #f0f0f0;
      display: flex; align-items: center; padding: 0 1.75rem; gap: 2rem;
    }
    .brand { font-weight: 800; font-size: 1.35rem; color: var(--accent); letter-spacing: -0.02em; }
    .nav { display: flex; gap: 1.5rem; font-size: 0.95rem; font-weight: 500; color: #374151; }
    .nav span { cursor: pointer; }
    .nav span.active { color: var(--accent); border-bottom: 2px solid var(--accent); padding-bottom: 4px; }
    .hero {
      height: 380px;
      background: linear-gradient(rgba(0,0,0,0.25), rgba(0,0,0,0.25)),
                  url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1600&q=80') center/cover;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      text-align: center; color: #fff; padding: 2rem;
    }
    .hero h1 {
      font-size: 3rem; font-weight: 800; margin: 0 0 0.75rem;
      letter-spacing: -0.03em; text-shadow: 0 2px 12px rgba(0,0,0,0.3);
    }
    .hero p { margin: 0 0 1.5rem; font-size: 1.1rem; opacity: 0.95; max-width: 520px; }
    .search-wrap {
      background: #fff; border-radius: 12px; padding: 0.35rem;
      box-shadow: 0 8px 32px rgba(0,0,0,0.18); display: flex; width: 100%; max-width: 580px;
    }
    .search {
      flex: 1; border: none; padding: 0.85rem 1.1rem; font-size: 1rem; outline: none; border-radius: 10px;
    }
    .mode-toggle {
      display: flex; background: rgba(255,255,255,0.15); border-radius: 8px; margin-top: 1rem;
    }
    .mode-toggle button {
      background: transparent; border: none; color: #fff; padding: 0.45rem 1.1rem;
      font-size: 0.85rem; font-weight: 600; cursor: pointer; border-radius: 8px;
    }
    .mode-toggle button.active { background: #fff; color: #111; }
    .filters {
      display: flex; gap: 0.4rem; margin-top: 1rem; flex-wrap: wrap; justify-content: center;
    }
    .filter-btn {
      background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.35);
      color: #fff; padding: 0.35rem 0.75rem; border-radius: 6px; cursor: pointer; font-size: 0.8rem;
    }
    .filter-btn.active { background: #fff; color: #111; }
    .disclaimer {
      background: #fffbeb; padding: 0.4rem 1.5rem; font-size: 0.72rem; color: #92400e; text-align: center;
    }
    .layout {
      display: grid; grid-template-columns: 1fr 480px;
      height: calc(100vh - 68px - 380px - 28px); min-height: 500px;
    }
    #map { height: 100%; }
    .list { overflow-y: auto; padding: 1rem; background: #fafafa; border-left: 1px solid #eee; }
    .count { font-size: 0.85rem; color: var(--muted); margin: 0 0 0.75rem 0.2rem; }
    .card {
      background: #fff; border: 1px solid #eee; border-radius: 12px;
      overflow: hidden; margin-bottom: 0.85rem; cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
    }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.08); }
    .card img { width: 100%; height: 170px; object-fit: cover; display: block; }
    .card-body { padding: 0.85rem 1rem 1rem; }
    .price { font-size: 1.3rem; font-weight: 800; margin: 0.15rem 0 0.1rem; }
    .details { font-size: 0.82rem; color: var(--muted); margin-bottom: 0.25rem; }
    .addr { font-weight: 600; font-size: 0.95rem; }
    .city { font-size: 0.8rem; color: #6b7280; }
    .why { font-size: 0.75rem; color: var(--muted); margin-top: 0.35rem; line-height: 1.4; }
    .badge {
      display: inline-block; font-size: 0.62rem; font-weight: 700; letter-spacing: 0.04em;
      padding: 2px 6px; border-radius: 4px; text-transform: uppercase;
    }
    .BUY, .RENT { background: #ccfbf1; color: #0f766e; }
    .FADE { background: #fef3c7; color: #b45309; }
    .DISTRESSED { background: #fee2e2; color: #b91c1c; }
    .REO { background: #ede9fe; color: #6d28d9; }
    .FSBO { background: #dbeafe; color: #1d4ed8; }
    .OFFMARKET { background: #f3f4f6; color: #374151; }
    .RAWLAND { background: #d1fae5; color: #047857; }
    .EXPIRED { background: #fce7f3; color: #be185d; }
    @media (max-width: 900px) {
      .hero { height: 300px; }
      .hero h1 { font-size: 2.2rem; }
      .layout { grid-template-columns: 1fr; grid-template-rows: 40vh 1fr; height: auto; }
      .list { border-left: none; border-top: 1px solid #eee; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Utah Land & Property</div>
    <div class="nav">
      <span class="active" data-mode="sale" onclick="setMode('sale')">For Sale</span>
      <span data-mode="rent" onclick="setMode('rent')">For Rent</span>
      <span>Analysis</span>
    </div>
  </div>

  <section class="hero">
    <h1 id="hero-title">Homes. Land. Signals.</h1>
    <p id="hero-sub">Independent market analysis across Utah. Not a brokerage.</p>
    <div class="search-wrap">
      <input class="search" id="search" placeholder="City, address, or neighborhood…" oninput="render()">
    </div>
    <div class="mode-toggle">
      <button class="active" data-mode="sale" onclick="setMode('sale')">For Sale</button>
      <button data-mode="rent" onclick="setMode('rent')">For Rent</button>
    </div>
    <div class="filters" id="filters"></div>
  </section>

  <div class="disclaimer">
    Analysis only — not a brokerage. We do not list, sell, or broker real estate. Signals from public records and market context. Verify independently.
  </div>

  <div class="layout">
    <div id="map"></div>
    <div class="list">
      <div class="count" id="count">Loading…</div>
      <div id="cards"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const saleData = [
      { call: "BUY", source: "Active", price: "$389,000", delta: "−12% vs ELO", address: "4200 S Highland Dr", city: "Salt Lake City", beds: 3, baths: 2, sqft: "1,840", why: "Below neighborhood ELO baseline.", lat: 40.76, lon: -111.89, img: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=600&q=70" },
      { call: "FADE", source: "Active", price: "$749,000", delta: "+18% vs ELO", address: "1800 E 900 S", city: "Salt Lake City", beds: 4, baths: 3, sqft: "2,650", why: "Above ELO in softening context.", lat: 40.75, lon: -111.84, img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=600&q=70" },
      { call: "DISTRESSED", source: "Short Sale", price: "$412,000", delta: "Short sale", address: "77 N 500 E", city: "Salt Lake City", beds: 3, baths: 2, sqft: "1,520", why: "Short sale flag.", lat: 40.77, lon: -111.88, img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?auto=format&fit=crop&w=600&q=70" },
      { call: "REO", source: "HUD REO", price: "$285,000", delta: "REO", address: "1450 W 3300 S", city: "Provo", beds: 3, baths: 1, sqft: "1,420", why: "HUD REO inventory.", lat: 40.23, lon: -111.66, img: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=600&q=70" },
      { call: "FSBO", source: "FSBO", price: "$520,000", delta: "FSBO", address: "890 E 2100 N", city: "Ogden", beds: 4, baths: 2, sqft: "2,100", why: "Owner-listed.", lat: 41.22, lon: -111.97, img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=600&q=70" },
      { call: "EXPIRED", source: "Expired", price: "$445,000", delta: "Expired 12d", address: "2100 S 200 E", city: "Salt Lake City", beds: 3, baths: 2, sqft: "1,680", why: "Listing expired.", lat: 40.73, lon: -111.88, img: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=600&q=70" },
      { call: "RAWLAND", source: "Raw Land", price: "$185,000", delta: "2.4 acres", address: "Near 7800 S 2700 W", city: "West Jordan", beds: 0, baths: 0, sqft: "0", why: "Public parcel. No structure.", lat: 40.61, lon: -111.98, img: "https://images.unsplash.com/photo-1500382017468-9049fed747ef?auto=format&fit=crop&w=600&q=70" },
      { call: "REO", source: "HUD REO", price: "$198,000", delta: "REO", address: "450 N 100 W", city: "St. George", beds: 2, baths: 1, sqft: "980", why: "HUD REO.", lat: 37.1, lon: -113.57, img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=600&q=70" }
    ];

    const rentData = [
      { call: "RENT", source: "Rental", price: "$2,450/mo", delta: "3 bd", address: "4200 S Highland Dr", city: "Salt Lake City", beds: 3, baths: 2, sqft: "1,840", why: "Active rental signal. Analysis only.", lat: 40.76, lon: -111.89, img: "https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=600&q=70" },
      { call: "RENT", source: "Rental", price: "$1,850/mo", delta: "2 bd", address: "1800 E 900 S", city: "Salt Lake City", beds: 2, baths: 1, sqft: "1,120", why: "Rental context. Not a listing.", lat: 40.75, lon: -111.84, img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=600&q=70" },
      { call: "RENT", source: "Rental", price: "$2,100/mo", delta: "3 bd", address: "1450 W 3300 S", city: "Provo", beds: 3, baths: 2, sqft: "1,550", why: "Provo rental signal.", lat: 40.23, lon: -111.66, img: "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=600&q=70" },
      { call: "RENT", source: "Rental", price: "$1,650/mo", delta: "2 bd", address: "890 E 2100 N", city: "Ogden", beds: 2, baths: 1, sqft: "980", why: "Ogden rental context.", lat: 41.22, lon: -111.97, img: "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=600&q=70" },
      { call: "RENT", source: "Rental", price: "$1,950/mo", delta: "3 bd", address: "450 N 100 W", city: "St. George", beds: 3, baths: 2, sqft: "1,420", why: "Southern Utah rental signal.", lat: 37.1, lon: -113.57, img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=600&q=70" }
    ];

    let mode = "sale";
    let filter = "all";
    let map, markers = [];

    map = L.map("map").setView([39.32, -111.09], 7);
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    function setMode(m) {
      mode = m;
      filter = "all";
      document.querySelectorAll("[data-mode]").forEach(el => {
        el.classList.toggle("active", el.dataset.mode === m);
      });
      document.getElementById("hero-title").textContent = m === "rent" ? "Rentals. Context." : "Homes. Land. Signals.";
      document.getElementById("hero-sub").textContent = m === "rent"
        ? "Rental signals across Utah. Analysis only — not a brokerage."
        : "Independent market analysis across Utah. Not a brokerage.";
      renderFilters();
      render();
    }

    function renderFilters() {
      const saleFilters = [
        ["all", "All"], ["BUY", "Below ELO"], ["FADE", "Above ELO"],
        ["DISTRESSED", "Short Sale"], ["REO", "REO"], ["FSBO", "FSBO"],
        ["EXPIRED", "Expired"], ["RAWLAND", "Raw Land"]
      ];
      const rentFilters = [["all", "All Rentals"]];
      const list = mode === "rent" ? rentFilters : saleFilters;
      document.getElementById("filters").innerHTML = list.map(([id, label]) =>
        `<button class="filter-btn ${id === filter ? 'active' : ''}" data-filter="${id}">${label}</button>`
      ).join("");
      document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.onclick = () => {
          filter = btn.dataset.filter;
          renderFilters();
          render();
        };
      });
    }

    function clearMarkers() {
      markers.forEach(m => map.removeLayer(m));
      markers = [];
    }

    function render() {
      const q = (document.getElementById("search").value || "").toLowerCase();
      let rows = mode === "rent" ? rentData : saleData;
      if (filter !== "all") rows = rows.filter(r => r.call === filter || r.source.toLowerCase().includes(filter.toLowerCase()));
      if (q) rows = rows.filter(r => (r.address + r.city).toLowerCase().includes(q));

      document.getElementById("count").textContent = rows.length + " result" + (rows.length === 1 ? "" : "s");

      document.getElementById("cards").innerHTML = rows.map((r, i) => `
        <div class="card" onclick="focusMarker(${i})">
          <img src="${r.img}" alt="">
          <div class="card-body">
            <span class="badge ${r.call}">${r.source}</span>
            <div class="price">${r.price}</div>
            <div class="details">${r.beds > 0 ? r.beds + ' bd · ' + r.baths + ' ba · ' : ''}${r.sqft !== '0' ? r.sqft + ' sqft' : r.delta}</div>
            <div class="addr">${r.address}</div>
            <div class="city">${r.city}, UT</div>
            <div class="why">${r.why}</div>
          </div>
        </div>
      `).join("") || '<div style="padding:1rem;color:#6b7280">No matches.</div>';

      clearMarkers();
      rows.forEach((r, i) => {
        const m = L.circleMarker([r.lat, r.lon], {
          radius: 8, color: "#fff", weight: 1.5, fillColor: "#006aff", fillOpacity: 0.9
        }).addTo(map).bindPopup(`<b>${r.price}</b><br>${r.address}<br>${r.city}`);
        m.on("click", () => {
          document.querySelectorAll(".card")[i]?.scrollIntoView({ behavior: "smooth", block: "nearest" });
        });
        markers.push(m);
      });

      if (rows.length) {
        const group = L.featureGroup(markers);
        map.fitBounds(group.getBounds().pad(0.25));
      }
    }

    window.focusMarker = function(i) {
      if (markers[i]) {
        map.setView(markers[i].getLatLng(), 12);
        markers[i].openPopup();
      }
    };

    window.setMode = setMode;
    renderFilters();
    render();
  </script>
</body>
</html>
