<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Your Property — Utah Land & Property</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #f8fafc; color: #111827; }
    .header { height: 68px; background: #fff; border-bottom: 1px solid #f0f0f0; display: flex; align-items: center; padding: 0 1.75rem; position: relative; }
    .brand { font-family: "Playfair Display", serif; font-weight: 700; font-size: 1.6rem; color: #003d99; letter-spacing: -0.02em; position: absolute; left: 50%; transform: translateX(-50%); text-decoration: none; }
    .nav-left { display: flex; gap: 1.25rem; align-items: center; font-size: 0.9rem; font-weight: 500; color: #374151; }
    .nav-left a { color: inherit; text-decoration: none; }
    .nav-left a:hover { color: #006aff; }
    .wrap { max-width: 480px; margin: 2.5rem auto; padding: 0 1rem; }
    h1 { font-size: 1.6rem; font-weight: 800; margin: 0 0 0.5rem; }
    p { color: #6b7280; font-size: 0.9rem; margin: 0 0 1.5rem; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #6b7280; margin: 1rem 0 0.35rem; text-transform: uppercase; letter-spacing: 0.04em; }
    input, select, textarea { width: 100%; padding: 0.65rem 0.8rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 0.95rem; background: #fff; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: #006aff; }
    textarea { min-height: 90px; }
    button { margin-top: 1.25rem; background: #006aff; color: #fff; border: none; padding: 0.75rem; border-radius: 8px; font-weight: 700; font-size: 0.95rem; cursor: pointer; width: 100%; }
    button:hover { background: #0056cc; }
    .note { margin-top: 1.25rem; font-size: 0.7rem; color: #9ca3af; text-align: center; }
  </style>
</head>
<body>
  <div class="header">
    <div class="nav-left">
      <a href="/">Homes</a>
      <a href="/">Land</a>
      <a href="/submit.html">List Property</a>
    </div>
    <a class="brand" href="/">Utah Land & Property</a>
  </div>
  <div class="wrap">
    <h1>List Your Property</h1>
    <p>Share a home, land, or FSBO. Reviewed before it appears on the desk.</p>
    <form id="form">
      <label>Address</label>
      <input id="address" required placeholder="123 Main St">
      <label>City</label>
      <input id="city" required placeholder="Salt Lake City">
      <label>Price (USD)</label>
      <input id="price" type="number" placeholder="450000">
      <label>Property Type</label>
      <select id="type">
        <option>Home</option>
        <option>Raw Land</option>
        <option>FSBO</option>
        <option>Short Sale</option>
        <option>Expired Listing</option>
        <option>Other</option>
      </select>
      <label>Beds / Baths / Sqft</label>
      <input id="details" placeholder="3 bd, 2 ba, 1,800 sqft">
      <label>Notes</label>
      <textarea id="notes" placeholder="Condition, off-market details, or why you're listing."></textarea>
      <label>Photos</label>
      <input id="photos" type="file" accept="image/*" multiple>
      <button type="submit">Submit for Review</button>
    </form>
    <div class="note">Analysis only — not a brokerage. Submissions are reviewed before publication.</div>
  </div>
  <script>
    document.getElementById("form").onsubmit = (e) => {
      e.preventDefault();
      if (!confirm("Submit this listing for review?")) return;
      const files = document.getElementById("photos").files;
      const photoNote = files.length ? "\n**Photos:** " + files.length + " selected" : "";
      const title = encodeURIComponent("Listing: " + document.getElementById("address").value);
      const body = encodeURIComponent(
        "**Address:** " + document.getElementById("address").value + "\n" +
        "**City:** " + document.getElementById("city").value + "\n" +
        "**Price:** " + (document.getElementById("price").value || "—") + "\n" +
        "**Type:** " + document.getElementById("type").value + "\n" +
        "**Details:** " + (document.getElementById("details").value || "—") + "\n\n" +
        "**Notes:**\n" + (document.getElementById("notes").value || "—") + photoNote
      );
      window.open("https://github.com/JediPythonCode/Utah-Land-Property/issues/new?title=" + title + "&body=" + body, "_blank");
    };
  </script>
</body>
</html>
