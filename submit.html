<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>List Your Property — Utah Land & Property</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: linear-gradient(135deg, #0b1220 0%, #1a2332 100%);
      color: #f3f4f6;
      min-height: 100vh;
    }
    .header {
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
    }
    .brand { font-weight: 800; font-size: 1.35rem; color: #3b82f6; text-decoration: none; letter-spacing: -0.02em; }
    .wrap {
      max-width: 480px;
      margin: 2rem auto;
      padding: 2rem;
      background: rgba(17, 24, 39, 0.8);
      border: 1px solid #374151;
      border-radius: 16px;
      backdrop-filter: blur(8px);
    }
    h1 { font-size: 1.75rem; font-weight: 800; margin: 0 0 0.5rem; letter-spacing: -0.02em; }
    p { color: #9ca3af; font-size: 0.9rem; margin: 0 0 1.75rem; line-height: 1.5; }
    label { display: block; font-size: 0.75rem; font-weight: 600; color: #9ca3af; margin: 1rem 0 0.4rem; text-transform: uppercase; letter-spacing: 0.04em; }
    input, select, textarea {
      width: 100%;
      padding: 0.7rem 0.85rem;
      border: 1px solid #374151;
      border-radius: 8px;
      background: #0b1220;
      color: #f3f4f6;
      font-size: 0.95rem;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #3b82f6; }
    textarea { min-height: 90px; resize: vertical; }
    button {
      margin-top: 1.5rem;
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: #fff;
      border: none;
      padding: 0.85rem;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      width: 100%;
      letter-spacing: 0.02em;
    }
    button:hover { opacity: 0.9; }
    .note {
      margin-top: 1.25rem;
      font-size: 0.7rem;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header"><a class="brand" href="/">Utah Land & Property</a></div>
  <div class="wrap">
    <h1>List Your Property</h1>
    <p>Share a home, land, or FSBO. Reviewed before it appears on the desk.</p>
    <form id="form">
      <label>Address</label>
      <input id="address" required placeholder="123 Main St">
      <label>City</label>
      <input id="city" required placeholder="Salt Lake City">
      <label>Price (USD)</label>
      <input id="price" type="number" placeholder="450000">
      <label>Property Type</label>
      <select id="type">
        <option>Home</option>
        <option>Raw Land</option>
        <option>FSBO</option>
        <option>Short Sale</option>
        <option>Expired Listing</option>
        <option>Other</option>
      </select>
      <label>Beds / Baths / Sqft</label>
      <input id="details" placeholder="3 bd, 2 ba, 1,800 sqft">
      <label>Notes</label>
      <textarea id="notes" placeholder="Condition, off-market details, or why you're listing."></textarea>
      <label>Photos</label>
      <input id="photos" type="file" accept="image/*" multiple style="padding:0.5rem;">
      <button type="submit">Submit for Review</button>
    </form>
    <div class="note">Analysis only — not a brokerage. Submissions are reviewed before publication.</div>
  </div>
  <script>
    document.getElementById("form").onsubmit = (e) => {
      e.preventDefault();
      if (!confirm("Submit this listing for review?")) return;
      const files = document.getElementById("photos").files;
      const photoNote = files.length ? "\n**Photos:** " + files.length + " selected (attach manually)" : "";
      const title = encodeURIComponent("Listing: " + document.getElementById("address").value);
      const body = encodeURIComponent(
        "**Address:** " + document.getElementById("address").value + "\n" +
        "**City:** " + document.getElementById("city").value + "\n" +
        "**Price:** " + (document.getElementById("price").value || "—") + "\n" +
        "**Type:** " + document.getElementById("type").value + "\n" +
        "**Details:** " + (document.getElementById("details").value || "—") + "\n\n" +
        "**Notes:**\n" + (document.getElementById("notes").value || "—") + photoNote
      );
      window.open("https://github.com/JediPythonCode/Utah-Land-Property/issues/new?title=" + title + "&body=" + body, "_blank");
    };
  </script>
</body>
</html>
