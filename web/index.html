<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Utah Land Desk</title>
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #0f172a; color: #e2e8f0; }
    header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 1.5rem; background: #1e293b; border-bottom: 1px solid #334155; }
    h1 { margin: 0; font-size: 1.25rem; letter-spacing: 0.05em; }
    #macro-strip { display: flex; gap: 1.5rem; padding: 0.5rem 1.5rem; background: #1e293b; font-size: 0.85rem; color: #94a3b8; }
    main { display: grid; grid-template-columns: 1fr 340px; gap: 1rem; padding: 1rem; }
    #board { display: flex; flex-direction: column; gap: 0.75rem; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 1rem; }
    .call { font-weight: 700; font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; }
    .BUY { background: #065f46; color: #6ee7b7; }
    .FADE { background: #7c2d12; color: #fdba74; }
    .DISTRESSED { background: #7f1d1d; color: #fca5a5; }
    .HOLD, .STANDARD { background: #334155; color: #cbd5e1; }
    .price { font-size: 1.4rem; font-weight: 700; color: #38bdf8; }
    aside { background: #1e293b; border-radius: 8px; padding: 1rem; }
  </style>
</head>
<body>
  <header>
    <h1>UTAH LAND DESK</h1>
    <nav>
      <button onclick="loadDesk()">Refresh</button>
    </nav>
  </header>
  <div id="macro-strip">
    <span id="rate">30yr: —</span>
    <span id="ue">UE: —</span>
    <span id="source">Source: —</span>
  </div>
  <main>
    <section id="board">Loading…</section>
    <aside>
      <h3>Agents</h3>
      <div id="agents">—</div>
      <h3>News Flags</h3>
      <div id="news">—</div>
    </aside>
  </main>
  <script>
    async function loadDesk() {
      const res = await fetch('/api/desk');
      const data = await res.json();
      document.getElementById('rate').textContent = `30yr: ${(data.macro.rate_30yr || 0).toFixed(2)}%`;
      document.getElementById('ue').textContent = `UE: ${(data.macro.unemployment_ut || 0).toFixed(1)}%`;
      document.getElementById('source').textContent = `Source: ${data.source || '—'}`;
      const board = document.getElementById('board');
      board.innerHTML = data.rows.map(r => `
        <div class="card">
          <span class="call ${r.grade.call}">${r.grade.call}</span>
          <div class="price">${r.grade.line}</div>
          <div>${r.address}</div>
          <div style="font-size:0.85rem;color:#94a3b8;margin-top:0.4rem">${r.grade.why}</div>
          <div style="font-size:0.75rem;color:#64748b;margin-top:0.3rem">Agent: ${r.agent.name} (ELO ${Math.round(r.agent.elo)})</div>
        </div>
      `).join('') || '<div class="card">No active listings yet. Add a WFRMLS token to secrets.toml or wait for demo data.</div>';
      const agents = await (await fetch('/api/agents')).json();
      document.getElementById('agents').innerHTML = agents.slice(0,8).map(a =>
        `<div>${a.name} — ELO ${Math.round(a.elo)}</div>`
      ).join('') || '—';
    }
    loadDesk();
    setInterval(loadDesk, 60000);
  </script>
</body>
</html>
